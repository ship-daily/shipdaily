# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shipdaily
      POSTGRES_PASSWORD: shipdaily
      POSTGRES_DB: shipdaily
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
